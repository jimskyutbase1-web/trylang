<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Status</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>ESP32 Status</h1>
      <button id="toggle-settings-btn" class="text-btn">Settings</button>
    </div>

    <!-- Status Box -->
    <div id="status-box" class="status-box offline">
      <span class="status-label">Status</span>
      <span id="status-text" class="status-value">OFFLINE</span>
    </div>

    <!-- Details -->
    <div class="info-list">
      <div class="info-row">
        <span>IP Address:</span>
        <strong id="ip-display">192.168.8.112</strong>
      </div>
      <div class="info-row">
        <span>Last Ping:</span>
        <strong id="last-ping-display">Never</strong>
      </div>
      <div class="info-row">
        <span>Message:</span>
        <span id="details-display">Waiting for server heartbeat...</span>
      </div>
    </div>

    <button id="ping-btn" class="primary-btn">Ping ESP32</button>

    <!-- Settings Form (Hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <hr>
      <h3>Configuration</h3>
      <label>Firebase Database URL</label>
      <input type="text" id="firebase-url-input" placeholder="https://your-db.firebaseio.com">

      <label>Target IP</label>
      <input type="text" id="esp-ip-input" value="192.168.8.112">

      <button id="save-btn" class="secondary-btn">Save</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
